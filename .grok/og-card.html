<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <style>
    @font-face {
      font-family: "KosugiGothic";
      src: url("./ipagp.ttf") format("truetype");
      font-weight: 400;
      font-style: normal;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: #002559;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "KosugiGothic", "IPA Pゴシック", sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      color: #ffffff;
    }
    .frame {
      width: 1104px;
      height: 534px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .lockup {
      text-align: center;
    }
    .bar {
      width: 72px;
      height: 4px;
      background: #FDD858;
      margin: 0 auto 40px;
    }
    .title {
      font-size: 76px;
      font-weight: 400;
      letter-spacing: 0.14em;
      line-height: 1.15;
      color: #ffffff;
      padding-left: 0.14em;
      text-shadow: 0.4px 0 0 #ffffff, -0.4px 0 0 #ffffff;
    }
    .subtitle {
      margin-top: 22px;
      font-size: 22px;
      letter-spacing: 0.48em;
      padding-left: 0.48em;
      color: #ffffff;
      line-height: 1.4;
    }
    .tagline {
      margin-top: 36px;
      font-size: 20px;
      letter-spacing: 0.12em;
      padding-left: 0.12em;
      color: #F7F8FB;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="frame">
    <div class="lockup">
      <div class="bar"></div>
      <div class="title">株式会社コスギ</div>
      <div class="subtitle">ユニフォーム専門店</div>
      <div class="tagline">プロの現場を、カッコよく支える。</div>
    </div>
  </div>
</body>
</html>
